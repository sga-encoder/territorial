<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Territorial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de Valoración Territorial para alcaldías colombianas: reconocimiento, caracterización y cuidado del territorio.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Tipografía: Rubik (títulos, --font-display) + Fredoka (contenido, --font-sans). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..600&family=Rubik:wght@400..700&display=swap" rel="stylesheet">
  <script>
    // UI Kit theming: apply the persisted scheme before first paint so a
    // returning light-theme user never sees the dark default flash (SSR markup
    // is always rendered dark). The storage key must match ThemeService
    // (src/app/components/ui/theme/theme.service.ts).
    try {
      var theme = localStorage.getItem('territorial-ui-theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
