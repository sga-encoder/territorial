<ui-container direction="column" [gap]="6">
  <ui-page-header title="Categorías" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (categoryService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="categoryService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!categoryService.isLoading() && !categoryService.hasCategories()) {
    <ui-card>
      <ui-empty-state
        icon="search"
        title="Aún no hay categorías registradas"
        message="Crea la primera categoría para clasificar las anotaciones."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear categoría
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="tableRows()"
      [groupsExpandedByDefault]="false"
      [actions]="actions"
      [loading]="categoryService.isLoading()"
      emptyMessage="Ninguna categoría coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
