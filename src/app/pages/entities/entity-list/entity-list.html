<ui-container direction="column" [gap]="6">
  <ui-page-header title="Entidades" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (entityService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="entityService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!entityService.isLoading() && !entityService.hasEntities()) {
    <ui-card>
      <ui-empty-state
        icon="map-pin"
        title="Aún no hay entidades registradas"
        message="Crea la primera entidad para empezar a caracterizar el territorio."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear entidad
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="filteredRows()"
      [actions]="actions"
      [loading]="entityService.isLoading()"
      emptyMessage="Ninguna entidad coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
