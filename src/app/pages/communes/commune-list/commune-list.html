<ui-container direction="column" [gap]="6">
  <ui-page-header title="Comunas" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (communeService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="communeService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!communeService.isLoading() && !communeService.hasCommunes()) {
    <ui-card>
      <ui-empty-state
        icon="map-pin"
        title="Aún no hay comunas registradas"
        message="Crea la primera comuna para asociarla a una ciudad."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear comuna
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig()" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="filteredRows()"
      [actions]="actions"
      [loading]="communeService.isLoading()"
      emptyMessage="Ninguna comuna coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
