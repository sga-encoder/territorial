<ui-container direction="column" [gap]="6">
  <ui-page-header title="Evidencias" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (evidenceService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="evidenceService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!evidenceService.isLoading() && !evidenceService.hasEvidences()) {
    <ui-card>
      <ui-empty-state
        icon="info"
        title="Aún no hay evidencias registradas"
        message="Adjunta la primera evidencia a una anotación."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear evidencia
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="filteredRows()"
      [actions]="actions"
      [loading]="evidenceService.isLoading()"
      emptyMessage="Ninguna evidencia coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
