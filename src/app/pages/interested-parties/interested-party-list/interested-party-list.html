<ui-container direction="column" [gap]="6">
  <ui-page-header title="Interesados" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (partyService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="partyService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!partyService.isLoading() && !partyService.hasParties()) {
    <ui-card>
      <ui-empty-state
        icon="info"
        title="Aún no hay interesados registrados"
        message="Vincula una entidad a una anotación para registrar su interés."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear interesado
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig()" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="filteredRows()"
      [actions]="actions"
      [loading]="partyService.isLoading()"
      emptyMessage="Ningún interesado coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
