<ui-container direction="column" [gap]="6">
  <ui-page-header title="Departamentos" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (departmentService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="departmentService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!departmentService.isLoading() && !departmentService.hasDepartments()) {
    <ui-card>
      <ui-empty-state
        icon="map-pin"
        title="Aún no hay departamentos registrados"
        message="Crea el primer departamento para empezar a estructurar el territorio."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear departamento
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="filteredRows()"
      [actions]="actions"
      [loading]="departmentService.isLoading()"
      emptyMessage="Ningún departamento coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
