<ui-container direction="column" [gap]="6">
  <ui-page-header title="Votos" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (voteService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="voteService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!voteService.isLoading() && !voteService.hasVotes()) {
    <ui-card>
      <ui-empty-state
        icon="check"
        title="Aún no hay votos registrados"
        message="Registra la primera valoración ciudadana de una anotación."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear voto
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig()" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="filteredRows()"
      [actions]="actions"
      [loading]="voteService.isLoading()"
      emptyMessage="Ningún voto coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
