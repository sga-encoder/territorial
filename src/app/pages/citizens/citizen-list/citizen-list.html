<ui-container direction="column" [gap]="6">
  <ui-page-header title="Ciudadanos" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (citizenService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="citizenService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!citizenService.isLoading() && !citizenService.hasCitizens()) {
    <ui-card>
      <ui-empty-state
        icon="user"
        title="Aún no hay ciudadanos registrados"
        message="Crea el primer ciudadano para asociarlo a anotaciones y votos."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear ciudadano
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="filteredRows()"
      [actions]="actions"
      [loading]="citizenService.isLoading()"
      emptyMessage="Ningún ciudadano coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
