<ui-container direction="column" [gap]="6">
  <ui-page-header title="Barrios" [subtitle]="subtitle()" [actions]="headerActions" />

  @if (neighborhoodService.error(); as errorMessage) {
    <ui-card>
      <ui-container justify="between" center="vertical" [gap]="3" wrap>
        <ui-text color="danger">{{ errorMessage }}</ui-text>
        <ui-button variant="secondary" size="sm" (clicked)="neighborhoodService.loadAll()">
          Reintentar
        </ui-button>
      </ui-container>
    </ui-card>
  }

  @if (!neighborhoodService.isLoading() && !neighborhoodService.hasNeighborhoods()) {
    <ui-card>
      <ui-empty-state
        icon="map-pin"
        title="Aún no hay barrios registrados"
        message="Crea el primer barrio para asociarlo a una comuna."
      >
        <ui-button variant="secondary" size="sm" (clicked)="openCreate()">
          <ui-icon name="plus" size="sm" />
          Crear barrio
        </ui-button>
      </ui-empty-state>
    </ui-card>
  } @else {
    <ui-card>
      <ui-filter [config]="filterConfig()" [data]="rows()" (filteredChange)="onFiltered($event)" />
    </ui-card>

    <ui-dynamic-table
      [columns]="columns"
      [rows]="filteredRows()"
      [actions]="actions"
      [loading]="neighborhoodService.isLoading()"
      emptyMessage="Ningún barrio coincide con los filtros"
      rowKey="id"
      [pageSize]="8"
    />
  }
</ui-container>
