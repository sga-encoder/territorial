<button
  type="button"
  class="fixed inset-0 z-30 bg-backdrop transition-opacity duration-300 ease-in-out md:hidden"
  [class.opacity-100]="sidebar.expanded()"
  [class.opacity-0]="!sidebar.expanded()"
  [class.pointer-events-auto]="sidebar.expanded()"
  [class.pointer-events-none]="!sidebar.expanded()"
  aria-label="Cerrar el menú de navegación"
  (click)="onBackdropClicked()"
></button>

<nav
  #navigation
  id="sidebar-navigation"
  tabindex="-1"
  aria-label="Navegación principal"
  class="inset-shadow-glass-highlight fixed inset-y-0 left-0 z-40 flex flex-col gap-4 overflow-y-auto rounded-none border border-glass-border bg-glass-surface p-4 shadow-lg backdrop-blur-glass [border-top-color:var(--color-border-h)] transition-[width,transform,background-color] duration-500 ease-[cubic-bezier(0.34,1.56,0.64,1)] -translate-x-full md:inset-y-3 md:left-3 md:translate-x-0 md:rounded-2xl"
  [class.w-64]="sidebar.visualExpanded()"
  [class.w-16]="!sidebar.visualExpanded()"
  [class.translate-x-0]="sidebar.expanded()"
  [class.md:px-2]="!sidebar.visualExpanded()"
  (mouseenter)="sidebar.setHovered(true)"
  (mouseleave)="sidebar.setHovered(false)"
>
  <p
    class="px-3 text-xs font-semibold uppercase tracking-wider text-muted"
    [class.hidden]="!sidebar.visualExpanded()"
  >
    Módulos
  </p>

  <ul class="flex flex-col gap-1">
    @for (entry of navItems(); track entry.label) {
      <li>
        <app-sidebar-item [item]="entry" (navigated)="onNavLinkClicked()" />
      </li>
    }
  </ul>
</nav>
